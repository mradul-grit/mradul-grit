<svg xmlns="http://www.w3.org/2000/svg" width="400" height="210" viewBox="0 0 400 210" role="img" aria-labelledby="title desc">
<title id="title">Developer level</title>
<desc id="desc">Level 4 Builder, 997 XP, 3 XP to the next level. XP comes from public GitHub activity using documented rules.</desc>
<style>
