# Rebuilds the profile cards and the contribution snake, then publishes them to
# the `output` branch as a single commit (force-pushed, so that branch never
# grows a history). The README links to the files on that branch.
#
# Schedule: once a day at 04:17 UTC, on manual dispatch, and when the config,
# scripts or this workflow change on main. See docs/SETUP.md.

name: Profile cards

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.config.json
      - scripts/**
      - .github/workflows/profile.yml

permissions: {}

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    name: Build cards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Last published cards. Used as the fallback if the API is unreachable.
      # Missing on the very first run, which is fine.
      - name: Fetch previous snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: output
          path: previous
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Build GitHub cards
        env:
          # Optional PAT with read:user. Without it the built-in token is used,
          # which sees public activity (and private activity only as anonymous counts).
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
        run: python -m scripts.profile_cards.build --out dist --previous previous

      - name: Build LeetCode card
        run: python -m scripts.profile_cards.build --leetcode --out dist --previous previous

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cards
          path: dist/
          retention-days: 3
          if-no-files-found: error

  snake:
    name: Generate snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake/snake.svg?color_snake=#0891B2
            snake/snake-dark.svg?palette=github-dark&color_snake=#22D3EE&color_dots=#141B2B,#0E3A4A,#106379,#1597AE,#22D3EE

      - name: Check output
        run: |
          for f in snake/snake.svg snake/snake-dark.svg; do
            head -c 200 "$f" | grep -q "<svg" || { echo "::error::$f is missing or not an SVG"; exit 1; }
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snake
          path: snake/
          retention-days: 3

  publish:
    name: Publish to output branch
    needs: [cards, snake]
    # Publish whenever the cards built, even if the snake failed: the previous
    # snake is carried over below.
    if: ${{ !cancelled() && needs.cards.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cards
          path: site

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.snake.result == 'success' }}
        with:
          name: snake
          path: site

      - name: Fetch previous snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: output
          path: previous
          persist-credentials: false

      - name: Carry over anything this run could not rebuild
        run: |
          for f in snake.svg snake-dark.svg; do
            if [ ! -s "site/$f" ] && [ -s "previous/$f" ]; then
              cp "previous/$f" "site/$f"
              echo "::warning::kept the previous $f"
            fi
          done
          ls -la site

      - name: Push to output branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd site
          cat > README.md <<'EOF'
          Generated by the "Profile cards" workflow on main. Do not edit; changes are overwritten on the next run.
          EOF
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update profile cards"
          # The token goes in an auth header for this one command, never into the remote URL.
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            push --force "https://github.com/${REPO}.git" output:output
